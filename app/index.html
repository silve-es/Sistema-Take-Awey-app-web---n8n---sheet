<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos & Take Away</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header / Nav -->
  <header class="header">
    <div class="brand">
      <span class="logo">🍕</span>
      <h1>Take Away</h1>
    </div>
    <div class="branch-selector">
      <label for="sucursal"><i class="fa-solid fa-store"></i></label>
      <select id="sucursal">
        <option value="Centro" selected>Sucursal Centro</option>
        <option value="Palermo">Sucursal Palermo</option>
        <option value="Belgrano">Sucursal Belgrano</option>
      </select>
    </div>
  </header>

  <!-- Categorías de Menú -->
  <nav class="categories-nav">
    <button class="cat-btn active" onclick="filtrarCategoria('todas')">Todas</button>
    <button class="cat-btn" onclick="filtrarCategoria('pizzas')">Pizzas</button>
    <button class="cat-btn" onclick="filtrarCategoria('empanadas')">Empanadas</button>
    <button class="cat-btn" onclick="filtrarCategoria('bebidas')">Bebidas</button>
  </nav>

  <!-- Contenedor del Menú (Productos) -->
  <main class="menu-container">
    <section class="section-title">
      <h2 id="categoria-titulo">Nuestros Productos</h2>
    </section>

    <div class="products-grid" id="products-grid">
      <!-- Los 3 productos iniciales cargados dinámicamente -->
    </div>
  </main>

  <!-- Barra Flotante del Carrito -->
  <div class="cart-bar hidden" id="cart-bar" onclick="abrirModalCarrito()">
    <div class="cart-info">
      <span class="badge" id="cart-count">0</span>
      <span>Ver Mi Carrito</span>
    </div>
    <div class="cart-total" id="cart-bar-total">$0</div>
  </div>

  <!-- Modal / Checkout del Carrito -->
  <div class="modal-overlay hidden" id="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fa-solid fa-cart-shopping"></i> Tu Pedido</h2>
        <button class="close-btn" onclick="cerrarModalCarrito()">&times;</button>
      </div>

      <div class="cart-items" id="cart-items-container">
        <!-- Ítems agregados -->
      </div>

      <div class="cart-summary">
        <div class="payment-method">
          <label for="metodo_pago">Forma de Pago</label>
          <select id="metodo_pago">
            <option value="Mercado Pago" selected>Mercado Pago</option>
            <option value="Efectivo">Efectivo (al retirar)</option>
            <option value="Tarjeta de Débito">Tarjeta de Débito</option>
            <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
          </select>
        </div>

        <div class="total-row">
          <span>Total a Pagar:</span>
          <strong id="modal-total">$0</strong>
        </div>

        <button class="btn-checkout" id="btn-checkout" onclick="confirmarPedido()">
          🚀 Confirmar y Pagar
        </button>

        <div id="status-message" class="status-message hidden"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
